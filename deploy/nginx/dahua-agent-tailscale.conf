server {
    listen 100.96.202.40:18081;
    server_name _;

    client_max_body_size 2m;

    location = /api/agent/gsp/status-queue {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location = /api/agent/gsp/status-result {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location = /api/agent/tool-backends/heartbeat {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location = /api/agent/pricing-workflows/claim {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location ~ ^/api/agent/pricing-workflows/[A-Za-z0-9_-]+/report$ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location / {
        return 404;
    }
}
