# Dedicated loopback-only origin for Cloudflare Tunnel.
#
# Keep this separate from dahua-auto-pricing.conf.  The public tunnel must not
# point at the broader port-80 virtual host because that host also exposes
# internal API namespaces used by the Windows/automation agents.

server {
    listen 127.0.0.1:18083;
    server_name _;

    client_max_body_size 100m;
    client_body_timeout 120s;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    root /data/Dahua_Pricing_Auto/frontend/current;
    index index.html;

    # Only cloudflared on this machine can reach this listener.  Trust its
    # canonical client-IP header, then pass the resulting address upstream.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    access_log /var/log/nginx/dahua-cloudflare-access.log combined;
    error_log /var/log/nginx/dahua-cloudflare-error.log warn;

    location = /onvif/device_service {
        access_log off;
        return 404;
    }

    # Never publish the internal agent or evolution control-plane APIs.
    location = /api/agent { return 404; }
    location ^~ /api/agent/ { return 404; }
    location = /api/evolution { return 404; }
    location ^~ /api/evolution/ { return 404; }

    # Browser API allowlist.  The backend independently authenticates price
    # data writes under /api/admin/price-data/* with
    # X-Price-Data-Admin-Token.
    location = /api/meta {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/query {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/query/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/models {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/models/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/batch {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location = /api/jobs {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/jobs/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/admin {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # Default-deny any API added later until it is reviewed and allowlisted.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =503;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
